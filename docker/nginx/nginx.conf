# The single published origin for the containerized stack.
#
# This file replaces docker/Caddyfile for everything except the host's own
# `http://localhost:54321/rest/v1` path, which the owner's dev server on port
# 3001 still points at through .env.local — so Caddy stays up beside nginx
# rather than being removed. On KVM2 nginx is the public front and TLS lands
# here; locally it publishes on loopback only (see the `ports:` mapping).

user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # A 413 or a 502 must not say which nginx build produced it.
  server_tokens off;

  # The invariant: nginx sits STRICTLY ABOVE the largest app-side ceiling, so the
  # 413 a candidate reads is the sentence the app wrote, not nginx's HTML page.
  # The measured set (2026-10-21, `grep -rn "maxBytes: [0-9]\|VIDEO_MAX_MB = \|CV_MAX_MB = " src`):
  #   50 MB  pitch video   src/app/api/attempt/[token]/video/route.ts:9
  #   20 MB  voice note    src/modules/careers/attachment-rules.ts:49
  #   10 MB  CV attach     src/modules/careers/attachment-rules.ts:40
  #    5 MB  career CV     src/modules/careers/cv-rules.ts:10
  # `25m` here was written when the largest of those was 20 MB, and the video route
  # has since doubled it — a 26–50 MB upload died on this file's 413 page before the
  # app's own sentence could run. 52 MB clears the 50 MB ceiling plus the multipart
  # envelope, and nothing else in the app asks for more.
  #
  # Raising it means an oversize body now reaches Node, and every upload door calls
  # `await request.formData()` — buffering the whole body — before its own size
  # check. So all five doors first ask `oversizeUploadResponse()`
  # (src/lib/files/upload-guard.ts) to refuse a body whose declared `Content-Length`
  # cannot possibly fit. That line only bounds the ordinary case: a chunked upload
  # carries no Content-Length, and the post-buffer checks remain the real gate.
  client_max_body_size 52m;

  gzip on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml image/svg+xml;

  # A signed-in app response answers with the session cookie, Next's Vary/RSC
  # headers and a `x-nextjs-*` trail, and `proxy_buffering off` reads that whole
  # response header into a single `proxy_buffer_size` block. The 4k/8k default is
  # smaller than the header, so the first authenticated page load failed with
  # `upstream sent too big header while reading response header from upstream`
  # (measured on GET /dashboard behind this file, 2026-10-21) while /login, which
  # sets no cookie, worked. Set at `http` so every proxied location gets it.
  # The other two are here because nginx derives their defaults from the same
  # page-size unit: raise `proxy_buffer_size` alone and `nginx -t` fails with
  # `"proxy_busy_buffers_size" must be less than the size of all "proxy_buffers"
  # minus one buffer`.
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;
  proxy_busy_buffers_size 32k;

  # Empty for a plain HTTP request, `upgrade` for a websocket handshake. Written
  # as a map because `proxy_set_header Connection "upgrade"` on every request
  # would defeat the keepalive pool to the app.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
  }

  # The Host the upstreams get: the client's own value, port included. Falling
  # back to `$host` only when a request carries no Host header at all (an
  # HTTP/1.0 probe), because an empty Host is worse than a portless one.
  map $http_host $sdg_host {
    default $http_host;
    ""      $host;
  }

  # The scheme the browser actually used. Behind a TLS terminator (the KVM2
  # `front` Caddy in docker-compose.kvm2.yml) this hop is plain HTTP, so
  # forwarding $scheme would tell the app `http` and make its Secure-cookie and
  # absolute-URL logic disagree with APP_URL. Trust an upstream
  # X-Forwarded-Proto when one is present; with none (local dev) fall back to
  # $scheme, so local behaviour is unchanged.
  map $http_x_forwarded_proto $sdg_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  upstream sdg_app {
    server app:3000;
    keepalive 32;
  }

  upstream sdg_rest {
    server rest:3000;
    keepalive 16;
  }

  # `$host` is the request Host with the port REMOVED, so on the dev origin
  # `http://localhost:3000` the app receives `localhost` and rejects every
  # server action: Next compares the browser's `Origin` (which carries the port)
  # against the forwarded host, and `localhost` != `localhost:3000`, so the login
  # form, the apply form and every console write answer
  # "x-forwarded-host header with value localhost does not match origin header
  # with value localhost:3000 … Aborting the action" (measured on the composed
  # stack, 2026-10-21). `$http_host` is the client's Host verbatim, port included.
  #
  # The app must not use this header to build user-facing URLs, and it does not:
  # assessment and careers links come from APP_URL (src/lib/config.ts), not the
  # request host, which is what keeps a client-controlled Host out of any email.

  server {
    listen 80;
    server_name _;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # Server-sent events. Three settings are load-bearing and the default
    # breaks each of them: `proxy_buffering off` (a buffered stream delivers
    # nothing until it fills), `gzip off` (compression buffers too), and a read
    # timeout longer than nginx's 60 s default (the probe is silent between
    # changes, so the default would close a healthy stream every minute).
    location = /api/live {
      proxy_pass http://sdg_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $sdg_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $sdg_proto;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      chunked_transfer_encoding off;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
    }

    # Immutable, content-hashed build output — the one place buffering pays for
    # itself, because nginx can hold the whole body and let a slow client take
    # its time without occupying a Next.js worker.
    location /_next/static/ {
      proxy_pass http://sdg_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $sdg_host;
      proxy_buffering on;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # PostgREST, at the same path Caddy served. The trailing slash on
    # `proxy_pass` is what strips the location prefix: `/rest/v1/applications`
    # reaches PostgREST as `/applications`. Drop that slash and every query
    # 404s, because PostgREST has no `/rest/v1` route of its own.
    location /rest/v1/ {
      proxy_pass http://sdg_rest/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $sdg_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $sdg_proto;
      # PostgREST answers a range query in one pass; 2 minutes is already
      # generous and a hung query should surface, not wait forever.
      proxy_read_timeout 120s;
    }

    # Buffering is OFF here on purpose, and not only for SSE. App Router pages
    # stream their HTML, server actions stream their reply, and the assistant
    # and careers chat stream AI tokens — all over ordinary `location /`
    # requests. A buffered proxy holds each of those until the response
    # completes, which turns progressive rendering into a stall. Enumerating
    # the streaming paths is the fragile version of this; the app has no
    # slow-client problem that a loopback upstream needs buffering to solve.
    location / {
      proxy_pass http://sdg_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $sdg_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $sdg_proto;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }
}
